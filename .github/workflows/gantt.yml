name: Gantt dan deteksi deadline

on:
  schedule:
    - cron: "0 17 * * *"
  push:
    branches: [main]
    paths:
      - tasks.csv
      - config.json
      - scripts/**
  workflow_dispatch:
    inputs:
      create_issues:
        description: "Buat issue untuk task yang belum punya issue"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: gantt
  cancel-in-progress: false

jobs:
  gantt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buat GANTT.md
        run: python scripts/generate_gantt.py

      - name: Commit hasil bila berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GANTT.md README.md
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "chore: perbarui Gantt chart [skip ci]"
            git push
          fi

      - name: Sinkron label terlambat pada issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CREATE_ISSUES: ${{ inputs.create_issues }}
        run: python scripts/sync_issues.py
